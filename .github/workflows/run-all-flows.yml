name: Run All Flows Against A Repository

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Source repository URL to analyze, e.g. https://github.com/owner/application/tree/main/src"
        required: true
        type: string
      target_repository:
        description: "Destination repository for generated artefacts, e.g. owner/service-catalogue-data"
        required: true
        type: string
      target_base_branch:
        description: "Base branch in the target repository (leave blank to use each agent's default)"
        required: false
        type: string
        default: ""
      flows:
        description: "Comma-separated flows to run, or 'all'"
        required: false
        type: string
        default: "all"
      defer_publication:
        description: "Generate only; skip opening pull requests"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: run-all-flows-${{ inputs.target_repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          all='[
            {"key":"openapi","agent":"openapi-spec-workflow","project_dir":"agents/hosted/openapi/openapi-spec-workflow"},
            {"key":"dbschema","agent":"dbschema-workflow","project_dir":"agents/hosted/dbschema/dbschema-workflow"},
            {"key":"eventcatalog","agent":"eventcatalog-workflow","project_dir":"agents/hosted/eventcatalog/eventcatalog-workflow"},
            {"key":"service-dependency","agent":"service-dependency-workflow","project_dir":"agents/hosted/servicedependencies/service-dependency-workflow"},
            {"key":"c4","agent":"c4-workflow","project_dir":"agents/hosted/c4/c4-workflow"},
            {"key":"local-dev-config","agent":"local-dev-config-workflow","project_dir":"agents/hosted/localdevconfig/local-dev-config-workflow"}
          ]'
          requested="${{ inputs.flows }}"
          if [ "$requested" = "all" ] || [ -z "$requested" ]; then
            matrix="$all"
          else
            keys_json=$(printf '%s' "$requested" | tr ',' '\n' | sed '/^$/d' | jq -R . | jq -s .)
            matrix=$(printf '%s' "$all" | jq --argjson keys "$keys_json" '[.[] | select(.key as $k | $keys | index($k))]')
            if [ "$(printf '%s' "$matrix" | jq 'length')" = "0" ]; then
              echo "::error::No matching flows for input '$requested'. Use 'all' or a comma-separated list of: openapi,dbschema,eventcatalog,service-dependency,c4,local-dev-config"
              exit 1
            fi
          fi
          echo "matrix=$(printf '%s' "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      AZD_ENV_NAME: ci
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-4o' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'uksouth' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'talent-day-rg' }}
      AZURE_AI_ACCOUNT_NAME: ${{ vars.AZURE_AI_ACCOUNT_NAME || 'talent-day-foundry' }}
      AZURE_AI_PROJECT_NAME: ${{ vars.AZURE_AI_PROJECT_NAME || 'talent-day-proj-default' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_AI_PROJECT_ENDPOINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing dev environment secret $name."
              missing=1
            fi
          done
          exit "$missing"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/setup-azd@v2

      - name: Install Foundry extensions
        working-directory: ${{ matrix.project_dir }}
        run: azd extension install azure.ai.agents

      - name: Configure existing Foundry project
        working-directory: ${{ matrix.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "$AZURE_SUBSCRIPTION_ID"
          project_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.CognitiveServices/accounts/$AZURE_AI_ACCOUNT_NAME/projects/$AZURE_AI_PROJECT_NAME"
          azd env select "$AZD_ENV_NAME" || azd env new "$AZD_ENV_NAME" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_TENANT_ID "$AZURE_TENANT_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          azd env set AZURE_AI_ACCOUNT_NAME "$AZURE_AI_ACCOUNT_NAME"
          azd env set AZURE_AI_PROJECT_NAME "$AZURE_AI_PROJECT_NAME"
          azd env set AZURE_AI_PROJECT_ID "$project_id"
          azd env set AZURE_AI_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$AZURE_AI_MODEL_DEPLOYMENT_NAME"
          azd env set USE_EXISTING_AI_PROJECT true
          azd env set ENABLE_HOSTED_AGENTS true
          azd env set ENABLE_CAPABILITY_HOST false

      - name: Run ${{ matrix.key }}
        working-directory: ${{ matrix.project_dir }}
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_BASE_BRANCH: ${{ inputs.target_base_branch }}
          DEFER_PUBLICATION: ${{ inputs.defer_publication }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg sourceUrl "$SOURCE_URL" \
            --arg targetRepository "$TARGET_REPOSITORY" \
            --arg targetBaseBranch "$TARGET_BASE_BRANCH" \
            --argjson deferPublication "$DEFER_PUBLICATION" \
            '{sourceUrl: $sourceUrl, targetRepository: $targetRepository}
             + (if $targetBaseBranch != "" then {targetBaseBranch: $targetBaseBranch} else {} end)
             + (if $deferPublication then {deferPublication: true} else {} end)')
          echo "Payload: $payload"
          response_file="$RUNNER_TEMP/${{ matrix.key }}-response.json"
          azd ai agent invoke "${{ matrix.agent }}" "$payload" > "$response_file" 2>&1 || true
          cat "$response_file"
          {
            echo "### ${{ matrix.key }}"
            echo '```json'
            cat "$response_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e . >/dev/null 2>&1 < "$response_file"; then
            echo "::error::${{ matrix.key }}: response was not valid JSON."
            exit 1
          fi
          if [ "$(jq -r '.success' "$response_file")" != "true" ]; then
            echo "::error::${{ matrix.key }}: workflow reported success=false."
            exit 1
          fi
