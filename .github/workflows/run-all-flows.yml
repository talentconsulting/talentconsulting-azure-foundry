name: Run All Flows Against A Repository

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "Manifest blob URL, e.g. https://github.com/owner/service-catalogue-data/blob/main/manifest.json"
        required: true
        type: string
      github_repo:
        description: "The 'github-repo' value to match in the manifest, e.g. https://github.com/owner/application"
        required: true
        type: string
      flows:
        description: "Comma-separated flows to run, or 'all' (only flows present on the matched manifest entry are ever run)"
        required: false
        type: string
        default: "all"
      defer_publication:
        description: "Generate only; skip opening pull requests"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: run-all-flows-${{ inputs.manifest_url }}-${{ inputs.github_repo }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      target_repository: ${{ steps.resolve.outputs.target_repository }}
      target_base_branch: ${{ steps.resolve.outputs.target_base_branch }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        shell: bash
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          GITHUB_REPO_INPUT: ${{ inputs.github_repo }}
          REQUESTED_FLOWS: ${{ inputs.flows }}
        run: |
          set -euo pipefail

          if [[ "$MANIFEST_URL" =~ ^https://github\.com/([^/]+)/([^/]+)/blob/([^/]+)/(.+)$ ]]; then
            owner="${BASH_REMATCH[1]}"
            repo="${BASH_REMATCH[2]}"
            branch="${BASH_REMATCH[3]}"
            path="${BASH_REMATCH[4]}"
          else
            echo "::error::manifest_url must look like https://github.com/<owner>/<repo>/blob/<branch>/<path>/manifest.json"
            exit 1
          fi
          target_repository="$owner/$repo"
          target_base_branch="$branch"
          raw_url="https://raw.githubusercontent.com/$owner/$repo/$branch/$path"

          manifest_file="$RUNNER_TEMP/manifest.json"
          if ! curl -fsSL "$raw_url" -o "$manifest_file"; then
            echo "::error::Failed to fetch manifest from $raw_url"
            exit 1
          fi
          if ! jq -e . >/dev/null 2>&1 < "$manifest_file"; then
            echo "::error::Manifest at $raw_url is not valid JSON."
            exit 1
          fi

          keys_json="null"
          if [ "$REQUESTED_FLOWS" != "all" ] && [ -n "$REQUESTED_FLOWS" ]; then
            keys_json=$(printf '%s' "$REQUESTED_FLOWS" | tr ',' '\n' | sed '/^$/d' | jq -R . | jq -s .)
          fi

          result=$(jq --arg repo "$GITHUB_REPO_INPUT" --argjson keys "$keys_json" \
            -f ".github/workflows/scripts/manifest-entry-flows.jq" "$manifest_file")
          if printf '%s' "$result" | jq -e 'has("error")' >/dev/null; then
            echo "::error::$(printf '%s' "$result" | jq -r '.error')"
            exit 1
          fi

          matrix=$(printf '%s' "$result" | jq -c '.matrix')
          echo "Resolved matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "target_repository=$target_repository" >> "$GITHUB_OUTPUT"
          echo "target_base_branch=$target_base_branch" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      AZD_ENV_NAME: ci
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-4o' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'uksouth' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'talent-day-rg' }}
      AZURE_AI_ACCOUNT_NAME: ${{ vars.AZURE_AI_ACCOUNT_NAME || 'talent-day-foundry' }}
      AZURE_AI_PROJECT_NAME: ${{ vars.AZURE_AI_PROJECT_NAME || 'talent-day-proj-default' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_AI_PROJECT_ENDPOINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing dev environment secret $name."
              missing=1
            fi
          done
          exit "$missing"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/setup-azd@v2

      - name: Sign in to azd with GitHub federated credentials
        shell: bash
        run: |
          set -euo pipefail
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Install Foundry extensions
        working-directory: ${{ matrix.project_dir }}
        run: |
          azd extension install azure.ai.agents
          azd extension install azure.ai.projects
          azd extension install microsoft.foundry

      - name: Configure existing Foundry project
        working-directory: ${{ matrix.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "$AZURE_SUBSCRIPTION_ID"
          project_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.CognitiveServices/accounts/$AZURE_AI_ACCOUNT_NAME/projects/$AZURE_AI_PROJECT_NAME"
          azd env select "$AZD_ENV_NAME" || azd env new "$AZD_ENV_NAME" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_TENANT_ID "$AZURE_TENANT_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          azd env set AZURE_AI_ACCOUNT_NAME "$AZURE_AI_ACCOUNT_NAME"
          azd env set AZURE_AI_PROJECT_NAME "$AZURE_AI_PROJECT_NAME"
          azd env set AZURE_AI_PROJECT_ID "$project_id"
          azd env set AZURE_AI_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$AZURE_AI_MODEL_DEPLOYMENT_NAME"
          azd env set USE_EXISTING_AI_PROJECT true
          azd env set ENABLE_HOSTED_AGENTS true
          azd env set ENABLE_CAPABILITY_HOST false

      - name: Run ${{ matrix.key }}
        working-directory: ${{ matrix.project_dir }}
        shell: bash
        env:
          SOURCE_URL: ${{ matrix.source_url }}
          TARGET_REPOSITORY: ${{ needs.prepare.outputs.target_repository }}
          TARGET_BASE_BRANCH: ${{ needs.prepare.outputs.target_base_branch }}
          DEFER_PUBLICATION: ${{ inputs.defer_publication }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg sourceUrl "$SOURCE_URL" \
            --arg targetRepository "$TARGET_REPOSITORY" \
            --arg targetBaseBranch "$TARGET_BASE_BRANCH" \
            --argjson deferPublication "$DEFER_PUBLICATION" \
            '{sourceUrl: $sourceUrl, targetRepository: $targetRepository}
             + (if $targetBaseBranch != "" then {targetBaseBranch: $targetBaseBranch} else {} end)
             + (if $deferPublication then {deferPublication: true} else {} end)')
          echo "Payload: $payload"
          response_file="$RUNNER_TEMP/${{ matrix.key }}-response.json"
          azd ai agent invoke "${{ matrix.agent }}" "$payload" > "$response_file" 2>&1 || true
          cat "$response_file"
          {
            echo "### ${{ matrix.key }}"
            echo '```json'
            cat "$response_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! jq -e . >/dev/null 2>&1 < "$response_file"; then
            echo "::error::${{ matrix.key }}: response was not valid JSON."
            exit 1
          fi
          if [ "$(jq -r '.success' "$response_file")" != "true" ]; then
            echo "::error::${{ matrix.key }}: workflow reported success=false."
            exit 1
          fi
