name: Deploy .NET Version Source Discovery

on:
  push:
    paths:
      - "agents/hosted/dotnetversion/dotnet-version-source-discovery/**"
      - ".github/workflows/deploy-dotnet-version-source-discovery.agent.yml"
      - ".github/workflows/deploy-dotnet-version-agent.reusable.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/deploy-dotnet-version-agent.reusable.yml
    with:
      project_dir: agents/hosted/dotnetversion/dotnet-version-source-discovery
      service_name: dotnet-version-source-discovery
      expected_marker: dotnetVersionFiles
    secrets: inherit
