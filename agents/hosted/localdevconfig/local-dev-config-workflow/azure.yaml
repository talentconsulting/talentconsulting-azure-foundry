# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: local-dev-config-workflow

services:
  local-dev-config-workflow:
    project: src/local-dev-config-workflow
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: Generates and optionally publishes one repository's local development configuration.
    environmentVariables:
      - name: LOCAL_DEV_CONFIG_DISCOVERY_AGENT_NAME
        value: ${LOCAL_DEV_CONFIG_DISCOVERY_AGENT_NAME}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: LOCAL_DEV_CONFIG_GENERATOR_AGENT_NAME
        value: ${LOCAL_DEV_CONFIG_GENERATOR_AGENT_NAME}
      - name: LOCAL_DEV_CONFIG_PR_CREATOR_AGENT_NAME
        value: ${LOCAL_DEV_CONFIG_PR_CREATOR_AGENT_NAME}
      - name: LOCAL_DEV_CONFIG_DISCOVERY_MAX_FILES
        value: ${LOCAL_DEV_CONFIG_DISCOVERY_MAX_FILES}
      - name: LOCAL_DEV_CONFIG_GENERATOR_BATCH_SIZE
        value: ${LOCAL_DEV_CONFIG_GENERATOR_BATCH_SIZE}
    kind: hosted
    name: local-dev-config-workflow
    displayName: Local Dev Config Workflow
    protocols:
      - protocol: responses
        version: 2.0.0

  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry
