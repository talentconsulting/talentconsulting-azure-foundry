name: Deploy OpenAPI Spec Generator

on:
  push:
    paths:
      - "agents/hosted/openapi/openapi-spec-generator/**"
      - ".github/workflows/deploy-openapi-spec-generator.agent.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: openapi-spec-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-and-test:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: dev

    env:
      AGENT_PROJECT_DIR: agents/hosted/openapi/openapi-spec-generator
      AZD_ENV_NAME: ci
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-4o' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'uksouth' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'talent-day-rg' }}
      AZURE_AI_ACCOUNT_NAME: ${{ vars.AZURE_AI_ACCOUNT_NAME || 'talent-day-foundry' }}
      AZURE_AI_PROJECT_NAME: ${{ vars.AZURE_AI_PROJECT_NAME || 'talent-day-proj-default' }}
      AGENT_TEST_API_FILE: ${{ vars.OPENAPI_SPEC_GENERATOR_TEST_API_FILE || 'https://github.com/talentconsulting/talentsuite-bidmanager/blob/main/src/TalentSuite.Server/Health/HealthController.cs' }}
      AGENT_TEST_SUPPORTING_FILE_1: ${{ vars.OPENAPI_SPEC_GENERATOR_TEST_SUPPORTING_FILE_1 || 'https://github.com/talentconsulting/talentsuite-bidmanager/blob/main/src/TalentSuite.Server/Health/HealthCheckResult.cs' }}
      AGENT_TEST_SUPPORTING_FILE_2: ${{ vars.OPENAPI_SPEC_GENERATOR_TEST_SUPPORTING_FILE_2 || 'https://github.com/talentconsulting/talentsuite-bidmanager/blob/main/src/TalentSuite.Server/Health/HealthResponse.cs' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_AI_PROJECT_ENDPOINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing dev environment secret $name."
              missing=1
            fi
          done
          exit "$missing"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install Foundry extensions
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          azd extension install azure.ai.agents
          azd extension install azure.ai.projects
          azd extension install microsoft.foundry

      - name: Configure azd authentication
        shell: bash
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Configure existing Foundry project
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          project_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.CognitiveServices/accounts/$AZURE_AI_ACCOUNT_NAME/projects/$AZURE_AI_PROJECT_NAME"

          azd env select "$AZD_ENV_NAME" || azd env new "$AZD_ENV_NAME" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_TENANT_ID "$AZURE_TENANT_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          azd env set AZURE_AI_ACCOUNT_NAME "$AZURE_AI_ACCOUNT_NAME"
          azd env set AZURE_AI_PROJECT_NAME "$AZURE_AI_PROJECT_NAME"
          azd env set AZURE_AI_PROJECT_ID "$project_id"
          azd env set AZURE_AI_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$AZURE_AI_MODEL_DEPLOYMENT_NAME"
          azd env set USE_EXISTING_AI_PROJECT true
          azd env set ENABLE_HOSTED_AGENTS true
          azd env set ENABLE_CAPABILITY_HOST false

      - name: Run unit tests
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: python3 -m unittest discover -s src/openapi-spec-generator -p 'test_*.py'

      - name: Deploy OpenAPI Spec Generator
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: azd deploy openapi-spec-generator --no-prompt

      - name: Verify deployed agent
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        run: azd ai agent show openapi-spec-generator --output json --no-prompt

      - name: Smoke test deployed OpenAPI contract
        working-directory: ${{ env.AGENT_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 -c 'import json, os; print(json.dumps({"apiFile": os.environ["AGENT_TEST_API_FILE"], "supportingFiles": [os.environ["AGENT_TEST_SUPPORTING_FILE_1"], os.environ["AGENT_TEST_SUPPORTING_FILE_2"]}, separators=(",", ":")))')
          response_file="$RUNNER_TEMP/openapi-spec-generator-response.txt"
          azd ai agent invoke openapi-spec-generator "$payload" > "$response_file" 2>&1
          cat "$response_file"

          if ! grep -Eq '"openapi"[[:space:]]*:[[:space:]]*"3\.1\.0"' "$response_file"; then
            echo "::error::The deployed agent did not return an OpenAPI 3.1.0 JSON document."
            exit 1
          fi

          if ! grep -q '"paths"' "$response_file"; then
            echo "::error::The deployed agent response did not contain paths."
            exit 1
          fi

          if grep -q '"error"' "$response_file"; then
            echo "::error::The deployed agent returned an error object."
            exit 1
          fi

          echo "OpenAPI Spec Generator smoke test passed."
