name: Deploy OpenAPI Spec Generator

on:
  push:
    paths:
      - "agents/prompt/openapi-spec-generator/**"
      - "scripts/deploy-agent.py"
      - "requirements-agent-deploy.txt"
      - ".github/workflows/deploy-openapi-spec-generator.agent.yml"

  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Azure login configuration
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_AI_PROJECT_ENDPOINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing environment secret $name."
              missing=1
            fi
          done
          exit "$missing"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-agent-deploy.txt

      - name: Deploy OpenAPI Spec Generator
        run: |
          python scripts/deploy-agent.py \
            --agent-dir agents/prompt/openapi-spec-generator \
            --create-new-version
