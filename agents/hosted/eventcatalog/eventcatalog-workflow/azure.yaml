# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: eventcatalog-workflow

services:
  eventcatalog-workflow:
    project: src/eventcatalog-workflow
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: Coordinates event-and-command-catalog generation and optional pull-request publication for one repository path.
    environmentVariables:
      - name: EVENTCATALOG_DISCOVERY_AGENT_NAME
        value: ${EVENTCATALOG_DISCOVERY_AGENT_NAME}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: EVENTCATALOG_GENERATOR_AGENT_NAME
        value: ${EVENTCATALOG_GENERATOR_AGENT_NAME}
      - name: EVENTCATALOG_PR_CREATOR_AGENT_NAME
        value: ${EVENTCATALOG_PR_CREATOR_AGENT_NAME}
      - name: EVENTCATALOG_DISCOVERY_MAX_FILES
        value: ${EVENTCATALOG_DISCOVERY_MAX_FILES}
      - name: EVENTCATALOG_GENERATOR_BATCH_SIZE
        value: ${EVENTCATALOG_GENERATOR_BATCH_SIZE}
    kind: hosted
    name: eventcatalog-workflow
    displayName: Event and Command Catalog Workflow
    protocols:
      - protocol: responses
        version: 2.0.0

  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry
