name: Run OpenAPI Spec Generation

on:
  workflow_dispatch:
    inputs:
      source_directory_url:
        description: "Full GitHub tree URL to scan recursively."
        required: true
        default: "https://github.com/talentconsulting/talentsuite-bidmanager/tree/main/src/TalentSuite.Server/Bids/Controllers"

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
      OUTPUT_DIR: outputs/openapi-spec-generation

    steps:
      - uses: actions/checkout@v4

      - name: Validate Azure login configuration
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_AI_PROJECT_ENDPOINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing environment secret $name."
              missing=1
            fi
          done
          exit "$missing"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-agent-deploy.txt

      - name: Validate workflow
        run: |
          python -m py_compile scripts/run-openapi-spec-generation-workflow.py
          python scripts/validate-workflow.py \
            --workflow-dir workflows/openapi-spec-generation \
            --runtime-script scripts/run-openapi-spec-generation-workflow.py

      - name: Scan and generate specifications
        run: |
          python scripts/run-openapi-spec-generation-workflow.py \
            --source-directory-url "${{ inputs.source_directory_url }}" \
            --output-dir "$OUTPUT_DIR"

      - name: Upload generated specifications
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-generation-output
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
