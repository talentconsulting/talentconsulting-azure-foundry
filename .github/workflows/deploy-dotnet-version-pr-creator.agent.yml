name: Deploy .NET Version PR Creator

on:
  push:
    paths:
      - "agents/hosted/dotnetversion/dotnet-version-pr-creator/**"
      - ".github/workflows/deploy-dotnet-version-pr-creator.agent.yml"
      - ".github/workflows/deploy-dotnet-version-agent.reusable.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/deploy-dotnet-version-agent.reusable.yml
    with:
      project_dir: agents/hosted/dotnetversion/dotnet-version-pr-creator
      service_name: dotnet-version-pr-creator
      expected_marker: invalid_repository
    secrets: inherit
