name: Deploy Service Dependency Source Discovery

on:
  push:
    paths:
      - "agents/hosted/servicedependencies/service-dependency-source-discovery/**"
      - ".github/workflows/deploy-service-dependency-source-discovery.agent.yml"
      - ".github/workflows/deploy-service-dependency-agent.reusable.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/deploy-service-dependency-agent.reusable.yml
    with:
      project_dir: agents/hosted/servicedependencies/service-dependency-source-discovery
      service_name: service-dependency-source-discovery
      expected_marker: sourceFiles
    secrets: inherit
