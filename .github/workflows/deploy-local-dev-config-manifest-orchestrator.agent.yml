name: Deploy Local Dev Config Manifest Orchestrator

on:
  push:
    paths:
      - "agents/hosted/localdevconfig/local-dev-config-manifest-orchestrator/**"
      - ".github/workflows/deploy-local-dev-config-manifest-orchestrator.agent.yml"
      - ".github/workflows/deploy-local-dev-config-agent.reusable.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/deploy-local-dev-config-agent.reusable.yml
    with:
      project_dir: agents/hosted/localdevconfig/local-dev-config-manifest-orchestrator
      service_name: local-dev-config-manifest-orchestrator
      expected_marker: invalid_input
    secrets: inherit
