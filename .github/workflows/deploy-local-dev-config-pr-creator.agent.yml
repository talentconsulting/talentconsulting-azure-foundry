name: Deploy Local Dev Config PR Creator

on:
  push:
    paths:
      - "agents/hosted/localdevconfig/local-dev-config-pr-creator/**"
      - ".github/workflows/deploy-local-dev-config-pr-creator.agent.yml"
      - ".github/workflows/deploy-local-dev-config-agent.reusable.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/deploy-local-dev-config-agent.reusable.yml
    with:
      project_dir: agents/hosted/localdevconfig/local-dev-config-pr-creator
      service_name: local-dev-config-pr-creator
      expected_marker: invalid_repository
    secrets: inherit
