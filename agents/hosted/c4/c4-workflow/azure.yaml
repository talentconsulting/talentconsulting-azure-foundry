# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: c4-workflow

services:
  c4-workflow:
    project: src/c4-workflow
    host: azure.ai.agent
    language: python
    uses: [ai-project]
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources: { cpu: "0.5", memory: 1Gi }
    description: Coordinates complete C4 discovery, draw.io generation, validation, and optional pull-request publication for one repository path.
    environmentVariables:
      - name: C4_DISCOVERY_AGENT_NAME
        value: ${C4_DISCOVERY_AGENT_NAME}
      - name: C4_GENERATOR_AGENT_NAME
        value: ${C4_GENERATOR_AGENT_NAME}
      - name: C4_PR_CREATOR_AGENT_NAME
        value: ${C4_PR_CREATOR_AGENT_NAME}
      - name: C4_DISCOVERY_MAX_FILES
        value: ${C4_DISCOVERY_MAX_FILES}
      - name: C4_GENERATOR_BATCH_SIZE
        value: ${C4_GENERATOR_BATCH_SIZE}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    kind: hosted
    name: c4-workflow
    displayName: C4 Workflow
    protocols:
      - protocol: responses
        version: 2.0.0
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry
