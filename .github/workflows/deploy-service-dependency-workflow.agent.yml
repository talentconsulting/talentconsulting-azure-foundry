name: Deploy Service Dependency Workflow

on:
  push:
    paths:
      - "agents/hosted/servicedependencies/service-dependency-workflow/**"
      - ".github/workflows/deploy-service-dependency-workflow.agent.yml"
      - ".github/workflows/deploy-service-dependency-agent.reusable.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/deploy-service-dependency-agent.reusable.yml
    with:
      project_dir: agents/hosted/servicedependencies/service-dependency-workflow
      service_name: service-dependency-workflow
      expected_marker: invalid_source_url
    secrets: inherit
