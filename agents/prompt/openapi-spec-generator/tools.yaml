tools:
  - type: mcp
    server_label: GitHub
    server_url: https://api.githubcopilot.com/mcp
    require_approval: never
    project_connection_id: GitHub

tool_usage:
  github:
    purpose: "Read exactly one source file at the repository and ref encoded in sourceFileUrl."
    allowed_operations:
      - "Read repository file contents"
    disallowed_operations:
      - "List or recursively scan repository directories"
      - "Read files other than sourceFileUrl"
      - "Create, update, or delete files"
      - "Create or delete branches"
      - "Create or merge pull requests"
      - "Modify repository settings"
      - "Trigger deployments"
