name: Deploy OpenAPI Specs Generator

on:
  push:
    paths:
      - "talent-agent-openAI-generator/**"
      - ".github/workflows/deploy-openai-specs-generator.agent.yml"

  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-4o' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Azure login configuration
        run: |
          missing=0

          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::error::Missing environment secret AZURE_CLIENT_ID."
            missing=1
          fi

          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::Missing environment secret AZURE_TENANT_ID."
            missing=1
          fi

          if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::Missing environment secret AZURE_SUBSCRIPTION_ID."
            missing=1
          fi

          if [ -z "$AZURE_AI_PROJECT_ENDPOINT" ]; then
            echo "::error::Missing environment secret AZURE_AI_PROJECT_ENDPOINT."
            missing=1
          fi

          exit "$missing"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/setup-azd@v2

      - name: Install Foundry extensions
        working-directory: talent-agent-openAI-generator
        run: |
          azd extension install azure.ai.agents
          azd extension install azure.ai.projects
          azd extension install microsoft.foundry

      - name: Configure deployment environment
        working-directory: talent-agent-openAI-generator
        run: |
          azd env new ci --no-prompt
          azd env set AZURE_AI_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$AZURE_AI_MODEL_DEPLOYMENT_NAME"

      - name: Deploy hosted OpenAPI Spec Generator
        working-directory: talent-agent-openAI-generator
        run: |
          azd deploy talent-agent-openAI-generator --no-prompt
