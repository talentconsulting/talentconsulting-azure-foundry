# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: dbschema-workflow

services:
  dbschema-workflow:
    project: src/dbschema-workflow
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: Coordinates database-schema generation and optional pull-request publication for one repository path.
    environmentVariables:
      - name: DBSCHEMA_DISCOVERY_AGENT_NAME
        value: ${DBSCHEMA_DISCOVERY_AGENT_NAME}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: DBSCHEMA_GENERATOR_AGENT_NAME
        value: ${DBSCHEMA_GENERATOR_AGENT_NAME}
      - name: DBSCHEMA_PR_CREATOR_AGENT_NAME
        value: ${DBSCHEMA_PR_CREATOR_AGENT_NAME}
      - name: DBSCHEMA_DISCOVERY_MAX_FILES
        value: ${DBSCHEMA_DISCOVERY_MAX_FILES}
    kind: hosted
    name: dbschema-workflow
    displayName: Database Schema Workflow
    protocols:
      - protocol: responses
        version: 2.0.0

  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

infra:
  provider: microsoft.foundry
