name: openapi-spec-generator
display_name: "OpenAPI Spec Generator (Single File)"
description: "Generates one OpenAPI 3.1 specification from one API source file identified by a full GitHub file URL."
version: "2.0.0"

agent:
  object: agent.version
  kind: prompt
  model: gpt-4o
  reasoning:
    effort: medium

inputs:
  sourceFileUrl:
    type: string
    required: true
    description: "Credential-free HTTPS GitHub blob URL identifying exactly one source file, branch or ref, and repository path."

outputs:
  type: json_schema
  json_schema:
    name: single_file_openapi_spec
    strict: true
    schema:
      type: object
      properties:
        domainApi:
          type: string
        openapi:
          type: object
        serviceName:
          type: string
        sourcePath:
          type: string
        fileName:
          type: string
        contentType:
          type: string
          enum:
            - application/json
      required:
        - domainApi
        - openapi
        - serviceName
        - sourcePath
        - fileName
        - contentType
      additionalProperties: false

files:
  instructions: instructions.md
  tools: tools.yaml
  guardrails: guardrails.md
  evaluations: evaluations.md
  release_notes: release-notes.md
