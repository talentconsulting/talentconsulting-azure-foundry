name: eventcatalog-source-discovery
services:
  eventcatalog-source-discovery:
    project: src/eventcatalog-source-discovery
    host: azure.ai.agent
    language: python
    uses: [ai-project]
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources: { cpu: "0.5", memory: 1Gi }
    description: Selects bounded, authoritative event and command catalog source files from one public GitHub repository path.
    kind: hosted
    name: eventcatalog-source-discovery
    displayName: Event and Command Catalog Source Discovery
    protocols:
      - protocol: responses
        version: 2.0.0
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
infra:
  provider: microsoft.foundry
